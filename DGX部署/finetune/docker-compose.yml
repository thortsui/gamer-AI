# gamer AI fine-tune：Qwen3.8-27B + LoRA（SFT）
#   docker compose build
#   docker compose run --rm train                      # 用 .env 的預設參數訓練
#   docker compose run --rm train python /app/train_lora.py --epochs 1 --classes A_qa,B   # 自訂
#   docker compose run --rm merge                      # 把 LoRA 合併成完整 bf16 權重（給 vLLM 服務用）
# ⚠ 訓練時要把 Qwen3.8-Flash-Next（8888）停掉，兩個一起放不進 119 GiB。
services:
  train:
    build: .
    image: gamer-ai-finetune:latest
    runtime: nvidia
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
      - BASE_MODEL=${BASE_MODEL:-Qwen/Qwen3.8-27B}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    volumes:
      - ${HF_HOME:-/home/ethan/.cache/huggingface}:/root/.cache/huggingface
      - ./data:/data
      - ./out:/out
    command: >
      python /app/train_lora.py --model ${BASE_MODEL:-Qwen/Qwen3.8-27B} --data /data --out /out/${RUN_NAME:-run1}
      --classes ${CLASSES:-A_qa,B,C,E,F} --epochs ${EPOCHS:-2} --lr ${LR:-1e-4} --r ${LORA_R:-16}
      --max-len ${MAX_LEN:-3072} --grad-accum ${GRAD_ACCUM:-16} --repeat ${REPEAT:-A_qa=2,B=4}
  # 拿合併後的權重當 gamer AI 的大腦（跟 Flash-Next 互斥：開這個前先 stop.sh 那個）
  #   docker compose up -d serve      # 佔 8888，代理不用改設定；served name 用 gamer-27b-ft-<run>
  #   docker compose down serve
  serve:
    image: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest
    container_name: vllm-gamer-27b-ft
    runtime: nvidia
    ipc: host
    shm_size: "16g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
    ports:
      - "8888:8000"
    volumes:
      - ./out:/out
      - ${HF_HOME:-/home/ethan/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_NO_USAGE_STATS=1
      - HF_HUB_OFFLINE=1
    command: >
      vllm serve /out/${RUN_NAME:-run1}/merged --host 0.0.0.0 --port 8000
      --served-model-name gamer-27b-ft-${RUN_NAME:-run1} --tensor-parallel-size 1
      --dtype bfloat16 --quantization ${SERVE_QUANT:-fp8} --kv-cache-dtype fp8 --gpu-memory-utilization ${SERVE_GPU_UTIL:-0.78}
      --max-model-len ${SERVE_MAX_LEN:-65536} --max-num-seqs 4 --max-num-batched-tokens 8192
      --limit-mm-per-prompt '{"image":8}' --enable-prefix-caching --enable-chunked-prefill
      --reasoning-parser qwen3 --trust-remote-code
  merge:
    image: gamer-ai-finetune:latest
    runtime: nvidia
    ipc: host
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_HUB_OFFLINE=1
    volumes:
      - ${HF_HOME:-/home/ethan/.cache/huggingface}:/root/.cache/huggingface
      - ./out:/out
    command: python /app/merge_lora.py --model ${BASE_MODEL:-Qwen/Qwen3.8-27B} --adapter /out/${RUN_NAME:-run1}/adapter --out /out/${RUN_NAME:-run1}/merged
