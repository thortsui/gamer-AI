<!doctype html><html lang="zh-Hant"><meta charset="utf-8">
<title>他的思考流程</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252a33;--tx:#e6e8eb;--dim:#8b93a1;--see:#7fd1ff;--think:#ffd479;--do:#8ce99a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.6 system-ui,"Noto Sans TC",sans-serif}
header{position:sticky;top:0;background:#0f1115ee;backdrop-filter:blur(6px);padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}
.dim{color:var(--dim)}
input{background:#0b0d11;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 10px;min-width:160px}
main{padding:12px;max-width:1100px;margin:0 auto}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-bottom:6px}
.zone{color:#ffb4a2}
.k{display:inline-block;width:4.5em;color:var(--dim);font-size:12px;vertical-align:top}
.see{color:var(--see)} .think{color:var(--think)} .do{color:var(--do)}
.line{margin:2px 0}
@media(max-width:520px){.k{display:block;width:auto}}
</style>
<header>
  <h1>他的思考流程</h1>
  <span class="dim" id="n"></span>
  <input id="q" placeholder="篩選：區／看到／想／做了">
  <label class="dim"><input type="checkbox" id="auto" checked> 每 5 秒更新</label>
</header>
<main id="list"></main>
<script>
const esc = s => String(s??"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  const r = await fetch('/api/flow'); const rows = await r.json();
  const q = document.getElementById('q').value.trim();
  const f = q ? rows.filter(o => JSON.stringify(o).includes(q)) : rows;
  document.getElementById('n').textContent = `最近 ${rows.length} 輪` + (q ? `／符合 ${f.length}` : '');
  document.getElementById('list').innerHTML = f.map(o => `
    <div class="row">
      <div class="meta"><b>#${esc(o.輪)}</b><span>${esc(o.時間)}</span>
        <span class="zone">${esc(o.區||'（沒標區）')}</span>
        <span>${esc(o.視角||'')}</span>
        ${o.任務?`<span>任務：${esc(o.任務)}</span>`:''}</div>
      <div class="line"><span class="k">看到</span><span class="see">${esc(o.看到)}</span></div>
      ${o.想?`<div class="line"><span class="k">想做</span><span class="think">${esc(o.想)}</span></div>`:''}
      <div class="line"><span class="k">做了</span><span class="do">${esc(o.做了)}</span></div>
    </div>`).join('') || '<p class="dim">還沒有紀錄（代理剛啟動、或還沒跑到有輸出的輪次）。</p>';
}
load(); document.getElementById('q').addEventListener('input', load);
setInterval(()=>{ if(document.getElementById('auto').checked) load(); }, 5000);
</script>
</html>
